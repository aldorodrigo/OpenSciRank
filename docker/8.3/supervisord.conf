[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Issue #42 — worker de cola. Procesa la cosecha OAI (cola `harvest`) en
; background y también la cola `mail`. --max-time recicla el proceso cada hora;
; --timeout (310s) debe ser > DB_QUEUE_RETRY_AFTER para no reintentar un job vivo.
[program:queue-worker]
command=php /var/www/html/artisan queue:work --queue=harvest,mail,default --sleep=3 --tries=3 --max-time=3600 --timeout=310
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
autostart=true
autorestart=true
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
