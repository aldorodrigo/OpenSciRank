<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Fondo gradiente -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Patrón decorativo de puntos -->
  <g fill="white" opacity="0.06">
    <circle cx="100" cy="100" r="2"/>
    <circle cx="200" cy="150" r="2"/>
    <circle cx="300" cy="80" r="2"/>
    <circle cx="1100" cy="500" r="2"/>
    <circle cx="1000" cy="550" r="2"/>
    <circle cx="900" cy="480" r="2"/>
  </g>

  <!-- Sello / shield central -->
  <g transform="translate(120, 220)">
    <path d="M50 0 L100 25 L100 90 Q100 130 50 160 Q0 130 0 90 L0 25 Z"
          fill="url(#badge)" stroke="white" stroke-width="3" stroke-opacity="0.5"/>
    <path d="M28 80 L45 97 L75 65"
          stroke="white" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Texto principal -->
  <text x="270" y="290" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700" fill="white">
    Editorial Standards
  </text>
  <text x="270" y="360" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="400" fill="white" opacity="0.85">
    Platform
  </text>

  <!-- Tagline -->
  <text x="270" y="430" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="white" opacity="0.7">
    Evaluación editorial transparente
  </text>
  <text x="270" y="460" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="white" opacity="0.7">
    para revistas científicas y libros académicos
  </text>

  <!-- Badge inferior -->
  <g transform="translate(120, 530)">
    <rect width="280" height="44" rx="22" fill="white" fill-opacity="0.15" stroke="white" stroke-opacity="0.3"/>
    <text x="22" y="30" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="white">
      ✓ Editorial Standards Seal
    </text>
  </g>
</svg>
