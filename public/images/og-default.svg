<?xml version="1.0" encoding="UTF-8"?>
{{-- Open Graph default — Editorial Standards Platform. 1200×630 (FB / LinkedIn / Twitter card spec).
     Diseño Sprint 5 #51 (BRAND.md). Fondo Editorial Blue Deep sólido, sin gradientes. --}}
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
    <title>Editorial Standards Platform</title>

    <!-- Fondo Editorial Blue Deep sólido -->
    <rect width="1200" height="630" fill="#172554"/>

    <!-- Accent strip izquierda emerald (signature de la marca / del sello) -->
    <rect x="0" y="0" width="12" height="630" fill="#10B981"/>

    <!-- Mark blanca (scaled from 100×100 viewBox to 140×140) -->
    <g fill="#FFFFFF" transform="translate(96 180) scale(1.4)">
        <rect x="8" y="8" width="14" height="84"/>
        <rect x="22" y="8" width="56" height="14"/>
        <rect x="78" y="8" width="14" height="32"/>
        <rect x="22" y="43" width="30" height="14"/>
        <rect x="22" y="78" width="56" height="14"/>
        <rect x="78" y="60" width="14" height="32"/>
    </g>

    <!-- Wordmark -->
    <text x="280" y="270" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="76" font-weight="600" fill="#FFFFFF">Editorial Standards</text>
    <text x="280" y="320" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#93C5FD" letter-spacing="8">PLATFORM</text>

    <!-- Tagline (promesa central canónica de BRAND.md) -->
    <text x="280" y="395" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="500" fill="#CBD5E1">Acreditación editorial técnica con sello reconocible.</text>

    <!-- Subtítulo / descripción -->
    <text x="280" y="440" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#94A3B8">Evaluamos revistas académicas contra estándares editoriales vigentes.</text>

    <!-- Footer signature -->
    <line x1="96" y1="540" x2="1104" y2="540" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="96" y="580" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="2">EDITORIALSTANDARDS.ORG</text>
    <text x="1104" y="580" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#64748B" letter-spacing="0.5" text-anchor="end">Verified technical evaluation · ISSN-indexed</text>
</svg>
